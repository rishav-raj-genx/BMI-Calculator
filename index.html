<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI - Calculator</title>
    <style>
        body {
    position: relative;
    padding: 0;
    min-height: 100vh;
    margin: 0;
}`

h1{
    font-size: 4rem;
}

.bmi{
    margin-top: 7rem;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("zoro.jpg");
    background-size: cover;
    background-position: center;
    opacity: 0.3;
    z-index: -1;
}
    </style>
</head>
<body>

    <h1>BMI Calculator!</h1>

    <div class="bmi">
    <h2>Height in cm: <input type="number" class="input" id="height"></h2>
    <h2>Weight in kg: <input type="number" class="input"  id="weight"></h2>
    <br>
    <br>
        <button>Calculate</button>

        <pre>



   BMI	      Weight-status
   
Below 18.  ->  Underweight
18.5–24.9. ->  Normal weight
25–29.9	   ->  Overweight
30–35	   ->  Obese
Over 35	   ->  Morbid obesity
        </pre>

</div>

    <script src="bmi.js"></script>
</body>
</html>
