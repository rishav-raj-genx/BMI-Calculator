<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI - Calculator</title>
    <style>

h1{
    font-size: 4rem;
}

.bmi{
    margin-top: 7rem;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

.bg {
  position: fixed;
  inset: 0;
  background-image: url("zoro.jpg");
  background-size: cover;
  background-position: center;
  opacity: 0.2;              
  z-index: -5;
}

input, button{
    z-index: 100;
    border:2px solid darkgrey
}

input{
border-radius: 30px;
text-align: center;
}

canvas {
    /* background-color: ; */
  position: fixed;           
  top: 0;
  left: 0;
  height: 100%;
  width: auto;
  /* width: 100vw;
  height: 100vh; */
  z-index: -1;              
  pointer-events: auto;
}

    </style>
</head>
<body>
    <div class="bg"></div>

    <h1>BMI Calculator!</h1>

    <div class="bmi">
    <h2>Height in cm: <input type="number" class="input" id="height"></h2>
    <h2>Weight in kg: <input type="number" class="input"  id="weight"></h2>
    <br>
    <br>
        <button>Calculate</button>

        <pre>



   BMI	      Weight-status
   
Below 18.5  ->  Underweight
18.5–24.9.  ->  Normal weight
25–29.9	    ->  Overweight
30–35	    ->  Obese
Over 35	    ->  Morbid obesity
        </pre>

</div>
    <canvas id="draw"></canvas>

    <script src="bmi.js"></script>
</body>
</html>
